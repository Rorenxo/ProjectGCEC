<div class="student-feed-container">

  <!-- Featured -->
  <section class="featured-section">
    <div class="featured-card-wrapper">
      <div class="featured-card" *ngIf="featuredEvent as f">
        <img [src]="f.imageUrl || 'assets/APERTURA.png'" class="featured-image" />

        <div class="featured-overlay"></div>

        <div class="featured-content">
          <h3 class="featured-title">{{ f.title }}</h3>

          <p class="featured-description">
            {{ f.description | slice:0:120 }}...
          </p>

          <button class="featured-button" (click)="openEventDetails(f)">
            Learn More <mat-icon>arrow_forward</mat-icon>
          </button>
        </div>
      </div>

      <div *ngIf="!featuredEvent" class="featured-placeholder">
        <div class="spinner"></div>
      </div>
    </div>
  </section>

  <!-- Events Feed -->
  <div class="events-feed">

    <ng-container *ngIf="recentEvents$ | async as events; else loadingEvents">

      <div class="event-category">
        <div class="category-header">
          <div class="category-indicator from-indigo-600 to-purple-600"></div>
          <h3 class="category-title">All Events</h3>
        </div>

        <div class="events-grid" *ngIf="events.length; else noEvents">

          <app-event-card
            *ngFor="let event of events"
            [event]="event"
            (open)="openEventDetails($event)">
          </app-event-card>

        </div>
      </div>

    </ng-container>

    <ng-template #loadingEvents>
      <div class="loading-container">
        <div class="spinner"></div>
        <p class="loading-text">Loading events...</p>
      </div>
    </ng-template>

    <ng-template #noEvents>
      <div class="no-events-container">
        <p class="no-events-title">No events available.</p>
        <p class="no-events-subtitle">Check back soon!</p>
      </div>
    </ng-template>
  </div>

</div>
