<mat-card class="event-card" (click)="openDetails()">

  <div class="thumb-wrapper">
    <img
      [src]="event?.imageUrl || 'assets/campusEvent.jpg'"
      class="event-thumb"
      alt="{{ event?.title }}"
    />
  </div>

  <mat-card-content>
    <div class="meta-row">
      <h4 class="event-title">{{ event?.title }}</h4>
      <div class="event-date">{{ event?.startDate | date:'mediumDate' }}</div>
    </div>

    <p class="event-summary">
      {{ (event?.description || '') | slice:0:120 }}...
    </p>
  </mat-card-content>

  <mat-card-actions class="card-actions">
    <button mat-button (click)="openDetails(); $event.stopPropagation()">View</button>
    <span class="spacer"></span>
    <mat-icon>bookmark_border</mat-icon>
  </mat-card-actions>

</mat-card>
