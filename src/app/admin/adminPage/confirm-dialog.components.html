<div class="confirm-dialog-container">
  <div class="dialog-header">
    <svg class="warning-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
    </svg>
    <h2 mat-dialog-title>{{ data.title }}</h2>
  </div>
  <mat-dialog-content class="dialog-content">
    <p>{{ data.message }}</p>
  </mat-dialog-content>
  <mat-dialog-actions class="dialog-actions" align="center">
    <button mat-stroked-button class="cancel-btn" (click)="onNoClick()">{{ data.cancelButtonText || 'Cancel' }}</button>
    <button mat-flat-button [color]="data.confirmButtonColor || 'warn'" class="delete-btn" [mat-dialog-close]="true" cdkFocusInitial>{{ data.confirmButtonText || 'Confirm' }}</button>
  </mat-dialog-actions>
</div>
