
<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="header-title-group">
        <img src="assets/gclogo.png" alt="Logo" class="logo"> 
        <h2>Gordon College Event Calendar</h2>
      </div>
      <h2>Sign In</h2>
      <p>Welcome back! Please sign in to your account.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" class="form-control" placeholder="domain@gordoncollege.edu.ph" formControlName="email" required>
        <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')" class="error-message">Email is required</div>
        <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')" class="error-message">Please enter a valid email</div>
        <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('domainMismatch')" class="error-message">Email must be a @gordoncollege.edu.ph domain</div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input id="password" [type]="hidePassword ? 'password' : 'text'" class="form-control" formControlName="password" required>
          <span class="toggle-password" (click)="togglePasswordVisibility()">
            <fa-icon [icon]="hidePassword ? faEyeSlash : faEye"></fa-icon>
          </span>
        </div>
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')" class="error-message">Password is required</div>
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('minlength')" class="error-message">Password must be at least 6 characters</div>
      </div>

      <button class="submit-btn" type="submit" [disabled]="loginForm.invalid">Login</button>
    </form>

    <div class="login-link">
      <span>Don't have an account? <a routerLink="/register">Sign Up</a></span>
    </div>
  </div>
</div>
